# Contrib module tests — cost-aware sharded matrix.
#
# WHY: agent-go is a multi-module repo (~145 contrib modules in go.work).
# The old ci.yml ran the FULL ~145-job test matrix on EVERY push and EVERY
# PR (plus a benchmark on every PR). This single change was the org's
# largest GitHub Actions spend.
#
# WHAT THIS DOES instead:
#   * Pull request: the `discover` job diffs against the PR base and builds
#     a matrix containing ONLY the contrib modules whose files changed.
#     Touch one pack -> one test job (not 145). Touch no contrib code ->
#     the workflow's path filter means it doesn't even run.
#   * Push to main + weekly schedule + manual dispatch: the FULL matrix
#     runs, so every contrib module is still tested regularly (coverage is
#     preserved, just not re-run on every unrelated PR). "Every" is meant
#     literally now — the module list is discovered from the filesystem, not
#     enumerated by hand. See the comment on ALL in the discover job.
#   * Benchmarks moved OFF pull requests to push/schedule only.
#
# TRADE-OFF: a PR that changes only core code (domain/, application/, ...)
# does not re-run the contrib matrix; that full validation happens on the
# push-to-main and the weekly scheduled run. Core changes are still fully
# tested by the core CI caller (ci.yml).
name: Contrib

on:
  # Push to main runs the FULL matrix (post-merge safety net + core
  # benchmark). Pull requests only trigger when contrib code changes, and
  # then the discover job narrows the matrix to the changed modules.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ["contrib/**"]
  # Weekly full-matrix cron removed: push-to-main already runs the full
  # matrix on every merge (the post-merge safety net), so the cron only
  # duplicated that spend.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Select modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: select
        name: Compute test matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The module list is DISCOVERED, not enumerated. It used to be three
          # hand-maintained variables (STORAGE / ENH / PACKS) whose union was
          # called ALL and described in the header as "every contrib module".
          # It was not: seven modules on disk had never been added to it, so
          # they had never been tested by any run — and two of them,
          # contrib/ai and contrib/aiplugin, did not even compile. Their tests
          # still imported go.klarlabs.de/statekit/ai and .../aiplugin, the
          # upstream packages statekit v1.9.0 removed and rehomed into these
          # very modules. Nothing failed, because nothing ran them.
          #
          # A list that must be edited by hand every time a module is added
          # will eventually not be, and the failure is invisible: the matrix
          # goes green having tested a subset it never claimed was a subset.
          # So ask the filesystem instead. Anything with a go.mod under
          # contrib/ is a contrib module and gets tested.
          ALL=$(find contrib -mindepth 2 -maxdepth 2 -name go.mod -print \
                | awk -F/ '{print $2}' | sort)

          # Storage modules run with -short: they gate on external services.
          STORAGE=$(printf '%s\n' $ALL | grep '^storage-' || true)

          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD -- 'contrib/**' | awk -F/ 'NF>1 {print $2}' | sort -u)
            sel=""
            for m in $ALL; do
              for c in $changed; do
                if [ "$m" = "$c" ]; then sel="$sel $m"; break; fi
              done
            done
          else
            # push to main, weekly schedule, or manual dispatch -> full matrix.
            sel="$ALL"
          fi

          inc=""
          for m in $sel; do
            short=false
            case " $(printf '%s ' $STORAGE) " in *" $m "*) short=true ;; esac
            inc="$inc{\"module\":\"$m\",\"short\":$short},"
          done
          inc="${inc%,}"
          matrix="{\"include\":[$inc]}"

          count=$(printf '%s' "$sel" | wc -w | tr -d ' ')
          if [ "$count" -gt 0 ]; then any=true; else any=false; fi

          echo "Selected $count contrib module(s) for event '$EVENT'."
          {
            echo "matrix=$matrix"
            echo "any=$any"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.module }}
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - name: Sync workspace
        run: go work sync
      - name: Test ${{ matrix.module }}
        run: |
          cd "contrib/${{ matrix.module }}"
          if [ "${{ matrix.short }}" = "true" ]; then
            go test -race -short -timeout=5m ./...
          else
            go test -race ./...
          fi

  benchmark:
    name: Benchmark (core)
    # Perf-sensitive core packages. Push/schedule/dispatch only — never on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - name: Sync workspace
        run: go work sync
      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=3 -timeout=5m \
            ./application/... \
            ./infrastructure/statemachine/... \
            ./infrastructure/planner/... \
            | tee bench-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: bench-results.txt
